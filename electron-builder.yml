appId: com.guyu.agentteam.desktop
productName: AgentTeam
directories:
  output: dist
# 只打包壳代码；resources/ 下的 jar、JRE、前端产物经 extraResources 放到安装目录
files:
  - main.js
  - preload.js
  - boot.html
  - package.json
  - build/icon.png
extraResources:
  - from: resources/server
    to: server
  - from: resources/web
    to: web
  - from: resources/jre
    to: jre
  - from: build/icon.ico
    to: icon.ico
# 应用图标来自 build/icon.ico，经 rcedit 写入 exe（无签名证书，不会执行签名步骤）
nsis:
  # 向导式安装：用户可选安装位置（仍为按用户安装，不需要管理员权限）
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${name}-setup-${version}.${ext}
